name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:check
      - run: pnpm typecheck
      - run: pnpm test:typecheck
      - run: pnpm lint
      - run: pnpm test:run
      - run: pnpm toolchain:check
      - run: pnpm clean:cache
      - run: pnpm build:weapp
      - run: pnpm build:h5
